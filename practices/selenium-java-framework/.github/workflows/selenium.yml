name: Selenium Java E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'practices/selenium-java-framework/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'practices/selenium-java-framework/**'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge ]
      test_group:
        description: 'TestNG group to run'
        required: false
        default: 'smoke'
        type: choice
        options: [ smoke, regression, all ]

env:
  JAVA_VERSION: '17'
  WORKING_DIR: practices/selenium-java-framework

jobs:
  # =========================================================
  # Job 1: Build & Compile
  # =========================================================
  build:
    name: 🔨 Build & Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Compile project
        run: mvn clean compile -q

      - name: ✅ Confirm build success
        run: echo "Build successful!"

  # =========================================================
  # Job 2: Run Tests
  # =========================================================
  test:
    name: 🧪 Run Tests (${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🌐 Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 🦊 Install Firefox (optional)
        if: ${{ github.event.inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: 📝 Create .env file from GitHub Secrets
        run: |
          cat > .env << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          ENV=staging
          BROWSER=${{ github.event.inputs.browser || 'chrome' }}
          HEADLESS=true
          BROWSER_WIDTH=1920
          BROWSER_HEIGHT=1080
          IMPLICIT_WAIT=10
          EXPLICIT_WAIT=30
          PAGE_LOAD_TIMEOUT=60
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          SCREENSHOT_DIR=target/screenshots
          EOF
          echo ".env file created (credentials from GitHub Secrets)"

      - name: 🧪 Run Tests
        run: |
          GROUP="${{ github.event.inputs.test_group || 'smoke' }}"
          BROWSER="${{ github.event.inputs.browser || 'chrome' }}"
          echo "Running group: $GROUP | browser: $BROWSER"
          mvn test \
            -Dbrowser=$BROWSER \
            -Dheadless=true \
            -Dgroups=$GROUP \
            -Dallure.results.directory=target/allure-results \
            --no-transfer-progress
        continue-on-error: true

      - name: 📸 Upload Screenshots on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/target/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/target/allure-results/
          retention-days: 7

      - name: 📋 Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================
  # Job 3: Generate & Publish Allure Report
  # =========================================================
  report:
    name: 📈 Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 📥 Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/target/allure-results/

      - name: 📈 Generate Allure HTML Report
        run: mvn allure:report --no-transfer-progress

      - name: 📤 Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/target/allure-report/
          retention-days: 14

      - name: 🚀 Publish to GitHub Pages (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WORKING_DIR }}/target/allure-report
          destination_dir: allure-report
